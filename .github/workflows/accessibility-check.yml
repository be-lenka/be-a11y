name: Accessibility Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  a11y:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

      - name: 🚦 CLI smoke — violations fixture must fail (exit 1)
        run: |
          code=0
          node index.js test/fixtures/violations > /dev/null 2>&1 || code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: ✅ CLI smoke — clean fixture must pass (exit 0) and write a report
        run: |
          node index.js test/fixtures/clean report-clean.json
          test -f report-clean.json
          node index.js test/fixtures/clean report-clean.html
          test -f report-clean.html
          head -1 report-clean.html | grep -qi '^<!doctype html'
          node index.js report-clean.html # dogfood: the HTML report passes be-a11y

      - name: 📦 Bundle smoke — dist/index.js must fail on violations (exit 1)
        run: |
          code=0
          node dist/index.js test/fixtures/violations > /dev/null 2>&1 || code=$?
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: 🔁 dist/ must be freshly built from source
        run: |
          npm run build
          git diff --quiet -- dist/ || {
            echo "dist/ is stale — run 'npm run build' and commit the result.";
            git --no-pager diff --stat -- dist/;
            exit 1;
          }

      - name: 📝 Generate sample report artifacts
        run: |
          node index.js test/fixtures/violations report.json || true
          node index.js test/fixtures/violations report.html || true
          node index.js report.html # dogfood: the HTML report passes be-a11y

      - name: 📤 Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            report.json
            report.html
